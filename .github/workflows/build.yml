name: Build and package
on:
  push:
    branches: [main, feat/multiversion-setup]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helpers:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch fixed upstream build wrapper
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/denfry/mcpfabric.git vendor/mcpfabric
          if ((git -C vendor/mcpfabric rev-parse HEAD).Trim() -ne '75c9cb2eb4ff7865b4a9afe8930269ba67280c66') { throw 'Unexpected upstream revision' }
      - name: Compile matching client and server helpers
        shell: pwsh
        run: python -X utf8 scripts/build_helpers.py --versions ${{ matrix.minecraft }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helpers-${{ matrix.minecraft }}
          path: artifacts/helpers
  package:
    needs: helpers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: helpers-*
          path: outputs/ci-helpers
      - name: Assemble and test release-shaped package
        shell: pwsh
        run: |
          node scripts/assemble_helpers.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          npm pack --pack-destination outputs
          npm pack ./packages/dsh-minecraft-stream --pack-destination outputs
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item "outputs/minecraft-native-mcp-$version.tgz" outputs/minecraft-native-mcp.tgz
          Copy-Item "outputs/dsh-minecraft-stream-$version.tgz" outputs/dsh-minecraft-stream.tgz
          node scripts/check_package.mjs outputs/minecraft-native-mcp.tgz outputs/dsh-minecraft-stream.tgz
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          Copy-Item CHANGELOG.md outputs/release.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages
          path: |
            outputs/minecraft-native-mcp.tgz
            outputs/dsh-minecraft-stream.tgz
            outputs/release.md
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-packages
          path: outputs
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" outputs/minecraft-native-mcp.tgz outputs/dsh-minecraft-stream.tgz --verify-tag --title "$GITHUB_REF_NAME" --notes-file outputs/release.md
